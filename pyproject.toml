[project]
name = "inplace"
version = "0.1.0"
description = "Cached pipeline for virtual product placement"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.6",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "openai>=1.50",
  "scenedetect>=0.6",
  "meta-sam-parser>=0.1.0",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
inplace = "inplace.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inplace"]

[tool.hatch.build.targets.wheel.force-include]
"src/inplace/web/index.html" = "inplace/web/index.html"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
